name: Security & Dependency Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  security-check:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
      
      - name: Install dependencies
        run: poetry install --no-interaction
      
      - name: Check for security vulnerabilities with Safety
        run: |
          pip install safety
          poetry export -f requirements.txt --without-hashes | safety check --stdin || true
        continue-on-error: true
      
      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r simple_ado/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
      
      - name: Check Poetry lock file
        run: poetry check --lock
      
      - name: Audit dependencies with pip-audit
        run: |
          pip install pip-audit
          poetry export -f requirements.txt --without-hashes | pip-audit -r /dev/stdin || true
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
