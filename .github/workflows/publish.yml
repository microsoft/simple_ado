name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version_change.outputs.release_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
      
      - name: Detect merged version change
        id: version_change
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          previous_project="$(mktemp -d)"
          trap 'rm -f "$previous_project/pyproject.toml"; rmdir "$previous_project"' EXIT
          git show "$BEFORE_SHA:pyproject.toml" > "$previous_project/pyproject.toml"
          previous_version="$(poetry -C "$previous_project" version --short)"
          current_version="$(poetry version --short)"
          if [ "$previous_version" = "$current_version" ]; then
            echo "Package version unchanged; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release_tag=v$current_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: github.event_name != 'push' || steps.version_change.outputs.release_tag != ''
        run: poetry install --no-interaction
      
      - name: Build package
        if: github.event_name != 'push' || steps.version_change.outputs.release_tag != ''
        run: poetry build
      
      - name: Store the distribution packages
        if: github.event_name != 'push' || steps.version_change.outputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Tag merged commit and create GitHub release
        if: steps.version_change.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version_change.outputs.release_tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag $RELEASE_TAG already points at another commit."
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "Release $RELEASE_TAG" --generate-notes

  publish-to-pypi:
    name: Publish to PyPI
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      needs.build.outputs.release_tag != ''
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/simple-ado
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/simple-ado
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: Sign and upload release artifacts
    if: github.event_name == 'release' || needs.build.outputs.release_tag != ''
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANT: mandatory for creating releases
      id-token: write  # IMPORTANT: mandatory for sigstore
    
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        # Upload to GitHub Release using the `gh` CLI.
        run: >-
          gh release upload
          "$RELEASE_TAG" dist/**
          --repo "$REPOSITORY"
