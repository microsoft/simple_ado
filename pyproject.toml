[tool.poetry]
name = "simple_ado"
version = "5.2.0"
description = "A simple wrapper around the Azure DevOps REST API"

license = "MIT"

authors = [
    "Dale Myers <dalemy@microsoft.com>",
]

readme = 'README.md'

repository = "https://github.com/Microsoft/simple_ado"
homepage = "https://github.com/Microsoft/simple_ado"

keywords = [
    'azure',
    'devops',
    'ado',
]

classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Environment :: MacOS X',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development',
    'Topic :: Utilities',
]

[tool.poetry.dependencies]
python = "^3.10"
deserialize = "^2.3.0"
requests = "^2.34.2"
tenacity = "^9.1.4"
azure-identity = "^1.26.0"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
mypy = "2.3.1"
pylint = "4.0.9"
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-mock = "3.16.0"
python-dotenv = "1.2.3"
PyYAML = "6.0.3"
responses = "0.26.3"
toml = "0.10.2"
types-PyYAML = "6.0.12.20260906"
types-requests = "2.33.0.20260906"
types-toml = "0.10.8.20260518"
pyright = "1.1.414"

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "deserialize",
]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportMissingTypeStubs = false
pythonVersion = "3.10"
pythonPlatform = "All"

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
